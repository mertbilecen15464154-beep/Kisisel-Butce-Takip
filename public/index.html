<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Bütçe ve Harcama Takip Uygulaması</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#111827',
                        borderCol: '#1f2937'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- GİRİŞ & KAYIT EKRANI (Modal/Overlay) -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="glass p-8 rounded-2xl w-full max-w-md space-y-6 shadow-2xl border border-gray-800">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center mx-auto text-xl font-bold border border-indigo-500/30">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h2 class="text-xl font-bold text-white">Kişisel Bütçe Yönetimi</h2>
                <p class="text-xs text-gray-400">Devam etmek için giriş yapın veya kayıt olun</p>
            </div>

            <!-- TAB BUTONLARI (Giriş Yap / Kayıt Ol) -->
            <div class="flex border-b border-gray-800 text-xs font-semibold">
                <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2.5 border-b-2 border-indigo-500 text-indigo-400 transition">Giriş Yap</button>
                <button id="registerTabBtn" onclick="switchTab('register')" class="flex-1 py-2.5 border-b-2 border-transparent text-gray-400 hover:text-white transition">Kayıt Ol</button>
            </div>

            <!-- GİRİŞ FORMU -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="loginEmail" value="demo@bute.com" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Şifre</label>
                    <input type="password" id="loginPassword" value="123456" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg transition">
                    Giriş Yap
                </button>
            </form>

            <!-- KAYIT FORMU -->
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">E-posta Adresi</label>
                    <input type="email" id="regEmail" placeholder="ornek@email.com" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Şifre</label>
                    <input type="password" id="regPassword" placeholder="******" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg transition">
                    Hesap Oluştur
                </button>
            </form>

            <p class="text-[11px] text-center text-gray-500">Demo Giriş: demo@bute.com / 123456</p>
        </div>
    </div>

    <!-- ANA UYGULAMA İÇERİĞİ -->
    <div id="appContent" class="hidden flex-1 flex flex-col">
        <!-- HEADER -->
        <header class="border-b border-gray-800 bg-gray-950/60 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h1 class="font-bold text-sm tracking-wide text-white">BÜTÇE & HARCAMA TAKİP</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="userEmailDisplay" class="text-xs text-gray-400 font-mono"></span>
                <button onclick="logout()" class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs rounded-lg transition font-medium">
                    Çıkış Yap
                </button>
            </div>
        </header>

        <!-- DASHBOARD CONTAINER -->
        <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full space-y-6">
            
            <!-- ÖZET KARTLARI (DASHBOARD) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass p-5 rounded-2xl border border-gray-800 space-y-2">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Toplam Bakiye</span>
                    <h2 id="totalBalance" class="text-2xl font-bold font-mono text-white">₺0.00</h2>
                </div>
                <div class="glass p-5 rounded-2xl border border-gray-800 space-y-2">
                    <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Toplam Gelir</span>
                    <h2 id="totalIncome" class="text-2xl font-bold font-mono text-emerald-400">₺0.00</h2>
                </div>
                <div class="glass p-5 rounded-2xl border border-gray-800 space-y-2">
                    <span class="text-xs font-semibold text-rose-400 uppercase tracking-wider">Toplam Gider</span>
                    <h2 id="totalExpense" class="text-2xl font-bold font-mono text-rose-400">₺0.00</h2>
                </div>
            </div>

            <!-- İŞLEM EKLEME VE FİLTRELEME ALANI -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Sol: Yeni İşlem Formu -->
                <div class="glass p-6 rounded-2xl border border-gray-800 space-y-4">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-indigo-400"></i> Yeni Gelir / Gider Ekle
                    </h3>
                    <form id="transactionForm" class="space-y-3.5 text-xs">
                        <div>
                            <label class="block text-gray-400 mb-1">İşlem Türü</label>
                            <select id="txType" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
                                <option value="gider">Gider (-)</option>
                                <option value="gelir">Gelir (+)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">İşlem Adı / Açıklama</label>
                            <input type="text" id="txTitle" placeholder="Örn: Market Alışverişi" required class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">Tutar (₺)</label>
                            <input type="number" step="0.01" id="txAmount" placeholder="0.00" required class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">Kategori</label>
                            <select id="txCategory" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
                                <option value="Yemek">Yemek</option>
                                <option value="Ulaşım">Ulaşım</option>
                                <option value="Faturalar">Faturalar</option>
                                <option value="Eğlence">Eğlence</option>
                                <option value="Gelir">Gelir</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-400 mb-1">Tarih</label>
                            <input type="date" id="txDate" required class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg">
                            İşlemi Kaydet
                        </button>
                    </form>
                </div>

                <!-- Sağ: İşlem Listesi ve Filtreleme -->
                <div class="lg:col-span-2 glass p-6 rounded-2xl border border-gray-800 space-y-4 flex flex-col">
                    <div class="flex flex-col md:flex-row items-center justify-between gap-3 pb-3 border-b border-gray-800">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-list text-emerald-400"></i> Son İşlemler & Harcama Geçmişi
                        </h3>
                        <!-- Filtreleme Araçları -->
                        <div class="flex items-center gap-2 text-xs">
                            <select id="filterCategory" onchange="loadTransactions()" class="bg-gray-900 border border-gray-800 rounded-lg p-2 text-white">
                                <option value="Tümü">Tüm Kategoriler</option>
                                <option value="Yemek">Yemek</option>
                                <option value="Ulaşım">Ulaşım</option>
                                <option value="Faturalar">Faturalar</option>
                                <option value="Eğlence">Eğlence</option>
                                <option value="Gelir">Gelir</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                    </div>

                    <!-- Liste Alanı -->
                    <div id="transactionList" class="space-y-2.5 overflow-y-auto max-h-[420px] pr-1 flex-1">
                        <!-- Dinamik doldurulacak -->
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- SCRIPT İŞLEMLERİ -->
    <script>
        document.getElementById('txDate').valueAsDate = new Date();

        // Sekme Değiştirme (Giriş Yap / Kayıt Ol)
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const regBtn = document.getElementById('registerTabBtn');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = 'flex-1 py-2.5 border-b-2 border-indigo-500 text-indigo-400 transition';
                regBtn.className = 'flex-1 py-2.5 border-b-2 border-transparent text-gray-400 hover:text-white transition';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                regBtn.className = 'flex-1 py-2.5 border-b-2 border-emerald-500 text-emerald-400 transition';
                loginBtn.className = 'flex-1 py-2.5 border-b-2 border-transparent text-gray-400 hover:text-white transition';
            }
        }

        // Giriş Yap İşlemi
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('userEmail', data.email);
                    initApp(data.email);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Sunucu bağlantı hatası!");
            }
        });

        // Kayıt Ol İşlemi
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').value = password;
                    switchTab('login');
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("Kayıt sırasında bir hata oluştu!");
            }
        });

        function initApp(email) {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            document.getElementById('userEmailDisplay').textContent = email;
            loadTransactions();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('userEmail');
            if (savedEmail) {
                initApp(savedEmail);
            }
        });

        function logout() {
            localStorage.removeItem('userEmail');
            location.reload();
        }

        async function loadTransactions() {
            const category = document.getElementById('filterCategory').value;
            try {
                const res = await fetch(`/api/transactions?category=${category}`);
                const data = await res.json();
                if (data.success) {
                    renderTransactions(data.transactions);
                    calculateSummary(data.transactions);
                }
            } catch (err) {
                console.error("Veri yüklenemedi", err);
            }
        }

        function renderTransactions(transactions) {
            const listEl = document.getElementById('transactionList');
            listEl.innerHTML = '';

            if (transactions.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">Kayıtlı işlem bulunamadı.</p>`;
                return;
            }

            transactions.forEach(t => {
                const isIncome = t.type === 'gelir' || t.amount > 0;
                const card = document.createElement('div');
                card.className = 'p-3 rounded-xl bg-gray-900/80 border border-gray-800 flex items-center justify-between text-xs';
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg ${isIncome ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'} flex items-center justify-center font-bold">
                            <i class="fa-solid ${isIncome ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                        </div>
                        <div>
                            <span class="font-bold text-white block">${t.title}</span>
                            <span class="text-[10px] text-gray-400">${t.category} · ${t.date}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-mono font-bold ${isIncome ? 'text-emerald-400' : 'text-rose-400'}">
                            ${isIncome ? '+' : ''}₺${Math.abs(t.amount).toFixed(2)}
                        </span>
                        <button onclick="deleteTransaction(${t.id})" class="text-gray-500 hover:text-red-400 p-1 transition">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function calculateSummary(transactions) {
            let totalIncome = 0;
            let totalExpense = 0;

            transactions.forEach(t => {
                if (t.amount > 0) {
                    totalIncome += t.amount;
                } else {
                    totalExpense += Math.abs(t.amount);
                }
            });

            const balance = totalIncome - totalExpense;

            document.getElementById('totalBalance').textContent = `₺${balance.toFixed(2)}`;
            document.getElementById('totalIncome').textContent = `₺${totalIncome.toFixed(2)}`;
            document.getElementById('totalExpense').textContent = `₺${totalExpense.toFixed(2)}`;
        }

        const transactionForm = document.getElementById('transactionForm');
        transactionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('txType').value;
            const title = document.getElementById('txTitle').value;
            const amount = document.getElementById('txAmount').value;
            const category = document.getElementById('txCategory').value;
            const date = document.getElementById('txDate').value;

            try {
                const res = await fetch('/api/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, title, amount, category, date })
                });
                const data = await res.json();
                if (data.success) {
                    transactionForm.reset();
                    document.getElementById('txDate').valueAsDate = new Date();
                    loadTransactions();
                }
            } catch (err) {
                alert("İşlem eklenemedi!");
            }
        });

        async function deleteTransaction(id) {
            try {
                const res = await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    loadTransactions();
                }
            } catch (err) {
                alert("Silinemedi!");
            }
        }
    </script>
</body>
</html>
